<style>
:root { color-scheme: light; --page: #f4f7f7; --surface: #ffffff; --ink: #333333; --ink-2: #565a61; --line: #cfe0e0; --accent: #009999; --yellow: #ffb340; --critical: #c4473f; --font: Arial, "Helvetica Neue", Helvetica, sans-serif; }

body { background: var(--page); color: var(--ink); font: 15px/1.45 var(--font); display: grid; place-items: center; padding: 16px; }

p { margin: 0; color: var(--ink-2); }
label { font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
input { font: 15px var(--font); color: var(--ink); background: var(--page); border: 1px solid var(--line); border-radius: 6px; padding: 9px 10px; }
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { font: 600 15px var(--font); color: #fff; background: var(--accent); border: 0; border-radius: 6px; padding: 10px; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
#msg { color: var(--critical); font-size: 14px; min-height: 1.4em; }
</style>

  go.disabled = true; go.textContent = "Opening…"; msg.textContent = "";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(SALT), iterations: ROUNDS, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(IV) }, key, b64(DATA)));
    document.open(); document.write(html); document.close();
  } catch (err) {
    msg.textContent = "Wrong password. Check it and try again.";
    go.disabled = false; go.textContent = "Open dashboard";
  }
});
})();
</script>
